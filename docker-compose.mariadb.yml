# PackDesk with its own MariaDB database. Start with:  docker compose up -d
# Then open http://<server>:8000 and follow the installation wizard (the installation code is shown
# with: docker compose logs web | grep "Installation code").
# Settings can be put in .env (see .env.example); none are required.
# phpMyAdmin runs alongside, on http://localhost:8081 of the server (see the phpmyadmin service below).
# Only this file is needed: save it as docker-compose.yml in an empty folder. The PackDesk image comes
# ready-made from GitHub (ghcr.io/fritz4all/packdesk); nothing to download or build.
name: packdesk

services:
  db:
    image: mariadb:10.6.21
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: packdesk
      MARIADB_USER: packdesk
      # Only reachable by PackDesk inside this setup; set your own DB_PASSWORD in .env if you like.
      # Must be the same as DB_PASSWORD of web below: keep both on ${DB_PASSWORD}. MariaDB only uses it when
      # its data is created for the first time; changing it later does not change the password.
      MARIADB_PASSWORD: ${DB_PASSWORD:-packdesk-internal}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  # phpMyAdmin to look into the database: http://<server>:8081. Log in as user packdesk with DB_PASSWORD.
  # Only reachable from the server itself (127.0.0.1); from another computer use an SSH tunnel
  # (ssh -L 8081:localhost:8081 <server>), or set PHPMYADMIN_ADDRESS=0.0.0.0 in .env on a trusted network.
  phpmyadmin:
    image: phpmyadmin:5.2.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 512M
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_ADDRESS:-127.0.0.1}:${PHPMYADMIN_PORT:-8081}:80"

  web:
    # The ready-made image; nothing to build. PACKDESK_VERSION in .env picks a version (e.g. 1.2);
    # default: the newest. Update with: docker compose pull && docker compose up -d
    image: ghcr.io/fritz4all/packdesk:${PACKDESK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: mariadb
      DB_HOST: db
      DB_NAME: packdesk
      DB_USER: packdesk
      DB_PASSWORD: ${DB_PASSWORD:-packdesk-internal}
      DATA_ROOT: /data
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # All files PackDesk keeps (logos, invoice PDFs, attachments, the settings of the wizard).
      # Back this folder up together with the database.
      - ${DATA_DIR:-../packdesk-data}:/data

volumes:
  # The database. Back up with: docker compose exec db mariadb-dump -u packdesk -p packdesk > packdesk.sql
  mariadb-data:
