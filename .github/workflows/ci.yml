name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: packdesk
          POSTGRES_USER: packdesk
          POSTGRES_PASSWORD: packdesk-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U packdesk"
          --health-interval 3s
          --health-retries 30
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://packdesk:packdesk-ci@localhost:5432/packdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: python manage.py compilemessages
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t packdesk:ci .
