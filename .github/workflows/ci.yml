name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    # Same tests on both supported databases.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mariadb]
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: packdesk
          POSTGRES_USER: packdesk
          POSTGRES_PASSWORD: packdesk-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U packdesk"
          --health-interval 3s
          --health-retries 30
      mariadb:
        image: mariadb:10.6.21
        env:
          MARIADB_DATABASE: packdesk
          MARIADB_USER: packdesk
          MARIADB_PASSWORD: packdesk-ci
          MARIADB_ROOT_PASSWORD: root-ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 3s
          --health-retries 30
    env:
      SECRET_KEY: ci-only-not-secret
      DB_ENGINE: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_NAME: packdesk
      DB_USER: packdesk
      DB_PASSWORD: packdesk-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext pkg-config libmysqlclient-dev libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core poppler-utils
      - run: pip install -r requirements-dev.txt
      - name: Allow the test database on MariaDB
        if: matrix.database == 'mariadb'
        run: >-
          docker exec ${{ job.services.mariadb.id }}
          mariadb -uroot -proot-ci -e "GRANT ALL ON \`test_packdesk\`.* TO 'packdesk'@'%'"
      - run: python manage.py compilemessages
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  docker:
    # Builds the image; after the tests pass on main or a version tag it is published as
    # ghcr.io/fritz4all/packdesk (latest, the commit, and a version: 0.1.<run number> for every build on
    # main, or the version of a tag like v1.2.0).
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "value=${GITHUB_REF_NAME#v}"; else echo "value=0.1.${GITHUB_RUN_NUMBER}"; fi >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fritz4all/packdesk
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=PackDesk
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.description=Webshop and admin for service packs, licences, spare parts and invoices
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PACKDESK_BUILD=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Fills the Releases page: one release per published image, listing the commits since the previous one.
    # A tag made with this token starts no new workflow run.
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v0.1.${GITHUB_RUN_NUMBER}"
          fi
          version="${tag#v}"
          previous=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$previous" ]; then range=("$previous..$GITHUB_SHA"); else range=(-n 30 "$GITHUB_SHA"); fi
          {
            echo "## Docker image"
            echo
            echo "\`ghcr.io/fritz4all/packdesk:$version\`"
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "${range[@]}"
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "PackDesk $version" --notes-file notes.md

  cleanup:
    # Keeps the newest 30 images, latest, and every main version (1.2 and 1.2.0, from tags like v1.2.0); the 0.1.x
    # builds go when they are older. An image has untagged parts, which this action keeps together with it.
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: packdesk
          keep-n-tagged: 30
          exclude-tags: '^latest$|^[1-9][0-9]*[.]'
          use-regex: true
          delete-untagged: true
          dry-run: true
