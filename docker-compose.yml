# PackDesk with its own PostgreSQL database. Start with:  docker compose up -d
# Then open http://<server>:8000 and follow the installation wizard (the installation code is shown
# with: docker compose logs web | grep "Installation code").
#
# Other variants: docker-compose.mariadb.yml (with MariaDB) and docker-compose.external-db.yml
# (an existing database server). Settings can be put in .env (see .env.example); none are required.
# Only this file is needed: save it as docker-compose.yml in an empty folder. The PackDesk image comes
# ready-made from GitHub (ghcr.io/fritz4all/packdesk); nothing to download or build.
name: packdesk

services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: packdesk
      POSTGRES_USER: packdesk
      # Only reachable by PackDesk inside this setup; set your own DB_PASSWORD in .env if you like.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-packdesk-internal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "packdesk"]
      interval: 3s
      retries: 30

  web:
    # The ready-made image; nothing to build. PACKDESK_VERSION in .env picks a version (e.g. 1.2);
    # default: the newest. Update with: docker compose pull && docker compose up -d
    image: ghcr.io/fritz4all/packdesk:${PACKDESK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: packdesk
      DB_USER: packdesk
      DB_PASSWORD: ${DB_PASSWORD:-packdesk-internal}
      DATA_ROOT: /data
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # All files PackDesk keeps (logos, invoice PDFs, attachments, the settings of the wizard).
      # Back this folder up together with the database.
      - ${DATA_DIR:-../packdesk-data}:/data

volumes:
  # The database. Back up with: docker compose exec db pg_dump -U packdesk packdesk > packdesk.sql
  postgres-data:
