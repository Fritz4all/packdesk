# Local development. Production compose follows in step E.
#
# Data that must live OUTSIDE the containers (and outside this Git folder):
#   1. Database (customers, licences, orders, invoices, settings, users)  -> volume "dbdata"
#   2. Website uploads: logos, favicon, customer logos                    -> ${DATA_DIR}/media
#   3. Private files: invoice PDFs, fault attachments, pending imports   -> ${DATA_DIR}/private
#   4. Old invoice archive (read-only)                                    -> ${DOCUMENT_ARCHIVE}
# DATA_DIR defaults to ../packdesk-data, next to (not inside) the repository.
# Everything else in a container can be thrown away; see docs/opslag.md.
name: packdesk

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: packdesk
      POSTGRES_USER: packdesk
      POSTGRES_PASSWORD: packdesk-dev
    volumes:
      # 1. Database
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "packdesk"]
      interval: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"

  web:
    build:
      context: .
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "python manage.py compilemessages --ignore=/venv -v0 && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "1"
      SECRET_KEY: dev-only-not-secret
      DATABASE_URL: postgres://packdesk:packdesk-dev@db:5432/packdesk
      ALLOWED_HOSTS: localhost,127.0.0.1
      EMAIL_HOST: mail
      EMAIL_PORT: "1025"
      MEDIA_ROOT: /data/media
      PRIVATE_MEDIA_ROOT: /data/private
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CACHE_HOME: /tmp/cache
      DOCUMENT_ARCHIVE_DIR: /data/archive
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Source code (development only; the production image contains the code itself)
      - .:/app
      # 2. Website uploads
      - ${DATA_DIR:-../packdesk-data}/media:/data/media
      # 3. Private files
      - ${DATA_DIR:-../packdesk-data}/private:/data/private
      # 4. Existing documents (old invoice PDFs), read-only. Set DOCUMENT_ARCHIVE in .env.
      - ${DOCUMENT_ARCHIVE:-../packdesk-data/archive}:/data/archive:ro

volumes:
  # 1. Database. Back up with: docker compose exec db pg_dump -U packdesk packdesk > <file outside Git>
  dbdata:
