# PackDesk for local development and testing (debug mode, test mail server on port 8025).
# Settings that differ per computer (database, folders) come from .env; see .env.example.
#
# Data lives outside the containers, so containers can be removed or replaced at any time:
#   database   -> the server in DB_HOST, or volume "dbdata" / "mariadbdata" (database container)
#   files      -> DATA_DIR (default ../packdesk-data), mounted as /data
#   old files  -> optional, read-only sources under /data-sources (see the web service)
# Overview of everything that is stored: docs/opslag.md.
name: packdesk

services:
  # Database: set in .env with DB_ENGINE (postgres or mariadb), DB_HOST, DB_PORT, DB_NAME, DB_USER
  # and DB_PASSWORD. On an existing database server leave COMPOSE_PROFILES empty; to run the
  # database in a container use COMPOSE_PROFILES=postgres (DB_HOST=postgres) or =mariadb (DB_HOST=mariadb).
  postgres:
    profiles: ["postgres"]
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-packdesk}
      POSTGRES_USER: ${DB_USER:-packdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-packdesk}"]
      interval: 3s
      retries: 30

  mariadb:
    profiles: ["mariadb"]
    image: mariadb:10.6.21
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DB_NAME:-packdesk}
      MARIADB_USER: ${DB_USER:-packdesk}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  # Catches every email PackDesk sends; read them at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"

  web:
    build:
      context: .
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    # Translations, then the tables of a new database (or a note about waiting changes), then the site.
    command: sh -c "python manage.py compilemessages --ignore=/venv -v0 && python manage.py setup_database && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mariadb:
        condition: service_healthy
        required: false
    environment:
      DEBUG: "1"
      SECRET_KEY: dev-only-not-secret
      DB_ENGINE: ${DB_ENGINE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-packdesk}
      DB_USER: ${DB_USER:-packdesk}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Test mail server (the "mail" service), not the one from .env.
      EMAIL_HOST: mail
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      DATA_ROOT: /data
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CACHE_HOME: /tmp/cache
      # Only used when this folder is mounted (see below); otherwise there is no archive.
      DOCUMENT_ARCHIVE_DIR: /data-sources/archive-invoices
    ports:
      - "127.0.0.1:8000:8000"
    # Each line is  <folder on this computer> : <folder in the container>[:ro = read-only].
    volumes:
      # Source code, so changes are visible at once (the production image contains the code itself).
      - .:/app

      # All files PackDesk keeps, one subfolder per purpose (created when first needed):
      #   website/            logo, favicon, customer logos; public through /media/
      #   invoices/<year>/    invoice PDFs made by PackDesk
      #   fault-attachments/  attachments of fault reports
      #   imports/            uploaded imports waiting to be checked; removed afterwards
      # Only website/ is public; PackDesk checks who may open anything else.
      # Back this folder up together with the database.
      - ${DATA_DIR:-../packdesk-data}:/data

      # Optional sources from other systems, read-only under /data-sources/<name>. Only needed when
      # taking over the previous webshop: its invoice PDFs. Add this to docker-compose.override.yml (not in Git,
      # read automatically) and set DOCUMENT_ARCHIVE=<folder> in .env:
      #
      #   services:
      #     web:
      #       volumes:
      #         - ${DOCUMENT_ARCHIVE}:/data-sources/archive-invoices:ro

volumes:
  # Database containers only. Back up with
  #   docker compose exec postgres pg_dump -U packdesk packdesk > <file outside Git>
  #   docker compose exec mariadb mariadb-dump -u packdesk -p packdesk > <file outside Git>
  dbdata:
  mariadbdata:
