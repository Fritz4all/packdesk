[pytest]
DJANGO_SETTINGS_MODULE = packdesk.settings
python_files = test_*.py
addopts = -q
# Known, harmless warnings: no collected static files during tests (WhiteNoise), and the setting
# FORMS_URLFIELD_ASSUME_HTTPS in settings.py, which Django warns about until version 6.
filterwarnings =
    ignore:No directory at:UserWarning
    ignore:The FORMS_URLFIELD_ASSUME_HTTPS transitional setting is deprecated
