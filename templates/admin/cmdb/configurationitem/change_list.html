{% extends "admin/change_list.html" %}
{% load i18n %}
{% block search_extra %}
    {% if can_import %}<a href="{% url 'admin:cmdb_configurationitem_import' %}" class="pd-btn"><span class="material-symbols-outlined">upload</span>{% translate "Import" %}</a>{% endif %}
    {% if can_export %}<a href="{% url 'admin:cmdb_configurationitem_export' %}?{{ request.GET.urlencode }}" class="pd-btn" title="{% translate 'The items in the list as filtered now' %}"><span class="material-symbols-outlined">download</span>{% translate "Export" %}</a>{% endif %}
{% endblock %}
