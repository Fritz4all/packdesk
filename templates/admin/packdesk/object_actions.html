{% if object_actions %}
<div class="flex flex-row flex-wrap gap-2 items-center mb-4">
    {% for action in object_actions %}
        <form method="post" action="{{ action.url }}"{% if action.confirm %} onsubmit="return confirm('{{ action.confirm|escapejs }}')"{% endif %}>
            {% csrf_token %}
            <button type="submit" class="pd-obj-btn{% if action.variant == 'danger' %} pd-obj-btn-danger{% endif %}">
                <span class="material-symbols-outlined text-[18px]">{{ action.icon }}</span>
                {{ action.label }}
            </button>
        </form>
    {% endfor %}
</div>
{% endif %}
