{% if object_actions %}
<div class="flex flex-row flex-wrap gap-2 items-center mb-4">
    {% for action in object_actions %}
        <form method="post" action="{{ action.url }}"{% if action.confirm %} onsubmit="return confirm('{{ action.confirm|escapejs }}')"{% endif %}>
            {% csrf_token %}
            <button type="submit"
                    class="flex gap-1 items-center h-[38px] px-3 rounded-default border text-sm font-medium shadow-xs
                           {% if action.variant == 'danger' %}border-red-600 text-red-600 hover:bg-red-600/10 dark:border-red-500 dark:text-red-500{% else %}border-base-200 bg-white text-font-important-light hover:bg-base-50 dark:bg-base-900 dark:border-base-700 dark:text-font-important-dark{% endif %}">
                <span class="material-symbols-outlined text-[18px]">{{ action.icon }}</span>
                {{ action.label }}
            </button>
        </form>
    {% endfor %}
</div>
{% endif %}
