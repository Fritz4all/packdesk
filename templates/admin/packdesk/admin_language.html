{% load i18n %}{% get_current_language as current %}{% get_available_languages as languages %}
<div class="border-t border-base-200 mt-1 pt-1 dark:border-base-700">
    <div class="mx-1 px-3 pt-1 text-xs text-base-400">{% translate "Admin language" %}</div>
    <form method="post" action="{% url 'admin_language' %}" class="flex gap-1 mx-1 px-2 py-1">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        {% for code, name in languages %}{% get_language_info for code as info %}
            <button type="submit" name="language" value="{{ code }}" title="{{ info.name_local|capfirst }}"
                    class="pd-lang{% if code == current %} is-current{% endif %}">{{ code|upper }}</button>
        {% endfor %}
    </form>
</div>
