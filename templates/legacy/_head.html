{% load i18n %}
<div class="flex flex-row flex-wrap gap-3 items-center justify-between mb-4">
    <div>
        <h1 class="font-semibold text-lg text-font-important-light dark:text-font-important-dark">{{ title }}</h1>
        <p class="text-sm text-base-500">{% translate "Old database" %}: <strong>{{ db.name }}</strong> ({{ db.get_engine_display }}, {{ db.host }}/{{ db.database }}) · {% translate "only read, never changed" %}</p>
    </div>
    <div class="flex flex-wrap gap-2 items-center">
        <form method="get" action="{% url 'legacy_search' db.pk %}" class="flex gap-2">
            <input type="search" name="q" value="{{ q|default:'' }}" class="pd-input" placeholder="{% translate 'Number, name, serial number, email…' %}" aria-label="{% translate 'Search in both databases' %}">
            <button class="pd-btn"><span class="material-symbols-outlined">search</span>{% translate "Search" %}</button>
        </form>
        <a class="pd-btn" href="{% url 'legacy_compare' db.pk %}">{% translate "Overview" %}</a>
    </div>
</div>
