{% if data.rows %}
<ul class="pd-list">
  {% for label, when, url in data.rows %}
    <li>{% if url %}<a href="{{ url }}">{{ label }}</a>{% else %}{{ label }}{% endif %}<span>{{ when|date:"j M Y" }}</span></li>
  {% endfor %}
</ul>
{% else %}<p class="text-sm text-base-500">{{ data.empty }}</p>{% endif %}
