<div class="grid gap-3 grid-cols-2 lg:grid-cols-4">
  {% for card in data.cards %}
    <div class="pd-stat-wrap" data-item="{{ card.item_key }}">
      <a href="{{ card.url }}" class="pd-stat{% if card.warn and card.value %} pd-stat-warn{% endif %}">
        <span class="material-symbols-outlined">{{ card.icon }}</span>
        <span class="pd-stat-value">{{ card.value }}</span>
        <span class="pd-stat-label">{{ card.label }}</span>
      </a>
      <button type="button" class="pd-item-toggle hidden" title="{{ hide_label }}"><span class="material-symbols-outlined text-[16px]">visibility_off</span></button>
    </div>
  {% endfor %}
</div>
